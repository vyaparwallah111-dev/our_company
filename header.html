<style>
    /* --- HEADER CSS --- */
    .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5%;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        position: sticky;
        top: 0;
        z-index: 1000;
        font-family: 'Poppins', sans-serif;
    }

    .logo {
        font-size: 26px;
        font-weight: 800;
        color: #0A4C95;
        text-decoration: none;
    }

    .logo span {
        color: #F37021;
    }

    .nav-menu {
        list-style: none;
        display: flex;
        gap: 30px;
        align-items: center;
        margin: 0;
        padding: 0;
    }

    .nav-menu li a {
        text-decoration: none;
        color: #0A4C95;
        font-weight: 600;
        transition: 0.3s;
        font-size: 1rem;
        cursor: pointer;
    }

    .nav-menu li a:hover,
    .nav-menu li a.active {
        color: #F37021;
    }

    /* Dropdown Magic */
    .dropdown {
        position: relative;
        display: inline-block;
    }

    .dropbtn {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .dropdown-content {
        visibility: hidden;
        opacity: 0;
        position: absolute;
        top: 150%;
        left: -20px;
        background-color: #ffffff;
        min-width: 220px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        z-index: 1000;
        transform: translateY(10px);
        transition: all 0.3s ease;
        padding: 10px 0;
        border-top: 3px solid #F37021;
    }

    .dropdown:hover .dropdown-content {
        visibility: visible;
        opacity: 1;
        transform: translateY(0);
        top: 100%;
    }

    .dropdown-content a {
        color: #2c3e50 !important;
        padding: 12px 20px !important;
        display: block;
        font-weight: 500 !important;
        border-bottom: 1px solid #f0f0f0;
    }

    .dropdown-content a:last-child {
        border-bottom: none;
    }

    .dropdown-content a:hover {
        background-color: #f8fcfb;
        color: #F37021 !important;
        padding-left: 25px !important;
    }

    /* --- ANIMATED BUTTON CSS --- */
    .btn-main-header {
        background: #F37021;
        color: white;
        padding: 12px 28px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        position: relative;
        /* Pulse Animation lagaya yahan */
        animation: pulseButton 2s infinite;
    }

    .btn-main-header:hover {
        background: #d95e17;
        transform: translateY(-3px);
        animation: none;
        /* Hover karne par animation ruk jayega */
        box-shadow: 0 8px 20px rgba(243, 112, 33, 0.4);
    }

    /* Animation Keyframes (Button dhak-dhak karega) */
    @keyframes pulseButton {
        0% {
            box-shadow: 0 0 0 0 rgba(243, 112, 33, 0.7);
        }

        70% {
            box-shadow: 0 0 0 10px rgba(243, 112, 33, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(243, 112, 33, 0);
        }
    }

    /* Icon Animation inside the button (Rocket up-down) */
    .btn-main-header i {
        animation: bounceRocket 2s infinite ease-in-out;
    }

    @keyframes bounceRocket {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-4px);
        }
    }

    /* -------------------------- */

    /* Mobile Hamburger */
    .menu-toggle {
        display: none;
        font-size: 1.8rem;
        color: #0A4C95;
        cursor: pointer;
    }

    @media(max-width: 992px) {
        .menu-toggle {
            display: block;
        }

        .btn-main-header {
            display: none;
        }

        .nav-wrapper {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
            padding: 20px 5%;
            display: none;
            flex-direction: column;
        }

        .nav-wrapper.active {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        .nav-menu {
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
            width: 100%;
        }

        .nav-menu li {
            width: 100%;
        }

        .nav-menu li a {
            display: block;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            width: 100%;
        }

        .dropdown-content {
            position: static;
            visibility: visible;
            opacity: 1;
            transform: none;
            box-shadow: none;
            border-top: none;
            padding: 0 0 0 15px;
            border-left: 2px solid #F37021;
            margin-top: 10px;
            display: none;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
